<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS Beginner Reference</title>
    <style>
        /* ========== CSS Selectors ========== */
        /* Element selector */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 20px;
        }

        /* Class selector (use .) */
        .highlight {
            color: blue;
            font-weight: bold;
        }

        /* ID selector (use #, should be unique) */
        #header {
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        /* Child/descendant selector */
        .container p {
            line-height: 1.6;
        }

        /* Pseudo-class example */
        a:hover {
            color: red;
        }
    </style>
</head>
<body>
    <!-- ========== Common HTML Tags ========== -->
    <h1 id="header">Main Heading</h1>
    <p>This is a paragraph with <span class="highlight">highlighted text</span>.</p>

    <h2>Lists</h2>
    <ul>
        <li>Unordered item 1</li>
        <li>Unordered item 2</li>
    </ul>
    <ol>
        <li>Ordered item 1</li>
    </ol>

    <h2>Links & Images</h2>
    <a href="https://example.com">Click here</a>
    <br>
    <img src="https://via.placeholder.com/100" alt="Placeholder image">

    <h2>Forms</h2>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name">
        <button type="submit">Submit</button>
    </form>

    <div class="container">
        <p>This paragraph is inside a container div.</p>
    </div>
</body>
</html>
